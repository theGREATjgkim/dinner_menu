<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>우리 가족 급식</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="우리가족 급식" />
<meta name="theme-color" content="#F6F8F1" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --lime-50:#F4FAEE;  --lime-100:#E8F5DC; --lime-200:#D6EBC2;
    --lime-500:#8FC178; --lime-700:#4E7A41;
    --lilac-50:#F8F5FD; --lilac-100:#EDE7FB; --lilac-200:#DFD5F7;
    --lilac-500:#A28CDF; --lilac-700:#5E4C9B;
    --ink:#23242A; --ink-2:#55575F; --muted:#9A9CA6;
    --line:rgba(35,36,42,.09);
    --radius:19px;
    --serif:"Gowun Batang", "Apple SD Gothic Neo", serif;
    --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;

    /* 2x2 격자 기준 글씨 크기 — 화면 높이에 따라 아래 미디어쿼리에서 조정 */
    --fs-school:12.5px;
    --fs-menu:11.8px;
    --fs-chip:9.5px;
    --fs-advtitle:13.5px;
    --fs-advdish:11px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:#FAFAF7;
    letter-spacing:-.2px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(125% 62% at 6% -8%, var(--lime-100) 0%, rgba(232,245,220,0) 62%),
      radial-gradient(115% 60% at 104% -2%, var(--lilac-100) 0%, rgba(237,231,251,0) 58%),
      linear-gradient(180deg,#FCFCF8 0%,#F8F6FC 100%);
  }
  ::-webkit-scrollbar{ width:0; height:0; }

  .app{ height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  /* ── 헤더 ───────────────────────────── */
  .hero{
    flex-shrink:0;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 0;
  }
  .hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .brand-sub{
    font-size:10px; font-weight:600; color:var(--lime-700);
    letter-spacing:.15em; text-transform:uppercase; margin-bottom:2px;
  }
  .brand-title{
    font-family:var(--serif); font-size:20px; font-weight:700;
    letter-spacing:-.5px; line-height:1.15; color:var(--ink);
  }
  .brand-title em{ font-style:normal; color:var(--lilac-700); }
  .icon-btn{
    flex-shrink:0; border:1px solid var(--line); background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-radius:13px; padding:8px 12px;
    font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--ink-2);
    display:flex; align-items:center; gap:5px;
  }
  .icon-btn:active{ background:rgba(255,255,255,.95); transform:scale(.97); }
  .icon-btn svg{ width:12px; height:12px; }

  /* ── 날짜 바 ─────────────────────────── */
  .date-bar{
    margin-top:10px;
    display:flex; align-items:center; gap:4px;
    background:rgba(255,255,255,.66);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:15px;
    padding:4px 5px;
  }
  .nav-btn{
    width:32px; height:32px; flex-shrink:0;
    border:none; background:transparent; border-radius:11px;
    font-size:17px; line-height:1; color:var(--ink-2); font-family:var(--sans);
  }
  .nav-btn:active{ background:var(--lime-50); }
  .date-center{
    flex:1; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-family:var(--sans); padding:2px 0;
  }
  .date-main{ font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-.3px; }
  .date-sub{ font-size:11px; font-weight:500; color:var(--muted); }
  .date-sub .today-tag{ color:var(--lime-700); font-weight:700; }
  .date-sub .back-tag{ color:var(--lilac-700); font-weight:700; }

  /* ── 2 x 2 격자 ──────────────────────── */
  .grid{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:8px;
    padding:9px 14px calc(env(safe-area-inset-bottom) + 10px);
  }
  .card, .advice{
    min-width:0; min-height:0;
    display:flex; flex-direction:column;
    border-radius:var(--radius);
    position:relative; overflow:hidden;
  }
  .card:active, .advice:active{ transform:scale(.985); }

  .card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);
    padding:11px 11px 4px;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--tone-bar);
  }
  .card.t1{ --tone-bar:linear-gradient(90deg,var(--lime-200),var(--lime-500)); --tone-soft:var(--lime-50); --tone-ink:var(--lime-700); --tone-dot:var(--lime-500); }
  .card.t2{ --tone-bar:linear-gradient(90deg,var(--lilac-200),var(--lilac-500)); --tone-soft:var(--lilac-50); --tone-ink:var(--lilac-700); --tone-dot:var(--lilac-500); }
  .card.t3{ --tone-bar:linear-gradient(90deg,var(--lime-200),#CFC2F2); --tone-soft:#F6F8F6; --tone-ink:#4C6B6A; --tone-dot:#8FBFAE; }

  .card-head{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:5px;
    padding-bottom:7px; margin-bottom:7px;
    border-bottom:1px solid var(--line);
  }
  .school-wrap{ display:flex; align-items:center; gap:5px; min-width:0; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--tone-dot); flex-shrink:0; }
  .school{
    font-size:var(--fs-school); font-weight:700; letter-spacing:-.4px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chip{
    flex-shrink:0; font-size:var(--fs-chip); font-weight:700; letter-spacing:-.1px;
    color:var(--tone-ink); background:var(--tone-soft);
    border:1px solid var(--line); border-radius:999px; padding:2.5px 7px;
  }

  /* 카드 안쪽만 스크롤 — 머리글은 고정 */
  .card-body{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:7px;
    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
            mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
  }

  .menu{ list-style:none; display:flex; flex-direction:column; gap:4.5px; }
  .menu li{
    display:flex; align-items:flex-start; gap:6px;
    font-size:var(--fs-menu); font-weight:500; line-height:1.4; color:var(--ink-2);
    word-break:keep-all;
  }
  .menu li::before{
    content:""; width:3px; height:3px; border-radius:50%;
    background:var(--tone-dot); opacity:.6;
    margin-top:6px; flex-shrink:0;
  }
  .meal-block + .meal-block{ margin-top:9px; }
  .meal-label{
    font-size:9.5px; font-weight:700; color:var(--tone-ink);
    letter-spacing:.04em; margin-bottom:5px;
  }
  .card-foot{
    margin-top:8px; padding-top:7px; border-top:1px dashed var(--line);
    font-size:9.5px; font-weight:500; color:var(--muted);
    display:flex; justify-content:flex-end;
  }
  .empty{
    font-size:11px; font-weight:500; color:var(--muted);
    text-align:center; padding:12px 2px 6px; line-height:1.45; word-break:keep-all;
  }
  .empty b{ display:block; font-size:11.5px; color:var(--ink-2); font-weight:700; margin-bottom:3px; }
  .skel{ display:flex; flex-direction:column; gap:7px; padding-top:2px; }
  .skel i{
    display:block; height:10px; border-radius:5px;
    background:linear-gradient(90deg,var(--lime-50),var(--lilac-50),var(--lime-50));
    animation:pulse 1.5s ease-in-out infinite;
  }
  .skel i:nth-child(2){ width:76%; animation-delay:.12s; }
  .skel i:nth-child(3){ width:58%; animation-delay:.24s; }
  @keyframes pulse{ 0%,100%{opacity:.55} 50%{opacity:1} }

  /* ── 저녁 메뉴 참고 (격자 첫 칸) ───────── */
  .advice{
    border:1px solid rgba(255,255,255,.85);
    background:linear-gradient(140deg, rgba(232,245,220,.96) 0%, rgba(240,238,250,.96) 52%, rgba(237,231,251,.96) 100%);
    padding:11px 12px 4px;
  }
  .advice::after{
    content:""; position:absolute; right:-26px; top:-32px;
    width:104px; height:104px; border-radius:50%;
    background:rgba(255,255,255,.3); pointer-events:none;
  }
  .adv-head{
    position:relative; z-index:1; flex-shrink:0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
    padding-bottom:7px; margin-bottom:7px;
    border-bottom:1px solid rgba(255,255,255,.8);
  }
  .adv-head-left{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .adv-eyebrow{
    font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--lilac-700); opacity:.7;
  }
  .adv-title{
    font-family:var(--serif); font-size:var(--fs-advtitle); font-weight:700;
    letter-spacing:-.4px; color:var(--ink); line-height:1.25; word-break:keep-all;
  }
  .adv-desc{ font-size:9.5px; font-weight:500; color:var(--ink-2); opacity:.72; margin-top:1px; }
  .adv-zoom{
    flex-shrink:0; width:22px; height:22px; border-radius:8px;
    background:rgba(255,255,255,.78); color:var(--ink-2);
    font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .adv-body{
    position:relative; z-index:1;
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:7px;
    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
            mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
  }
  .adv-row{
    display:flex; align-items:flex-start; gap:6px;
    padding:5px 0; border-top:1px solid rgba(255,255,255,.78);
  }
  .adv-row:first-child{ border-top:none; padding-top:0; }
  .adv-tag{
    flex-shrink:0; margin-top:.5px;
    font-size:9px; font-weight:700; letter-spacing:-.1px;
    padding:3px 6.5px; border-radius:999px;
    background:rgba(255,255,255,.92); white-space:nowrap;
  }
  .adv-tag.m{ color:var(--lime-700); }
  .adv-tag.f{ color:var(--lilac-700); }
  .adv-tag.e{ color:#4C6B6A; }
  .adv-dishes{
    font-size:var(--fs-advdish); font-weight:600; line-height:1.4;
    color:var(--ink); word-break:keep-all;
  }
  .adv-dishes em{
    font-style:normal; font-size:9px; font-weight:700;
    color:var(--ink-2); opacity:.55; margin-left:1px;
  }
  .adv-dishes .sep{ color:var(--muted); opacity:.5; margin:0 3px; }
  .adv-minor{
    margin-top:6px; font-size:9.5px; font-weight:500;
    color:var(--ink-2); opacity:.65; line-height:1.45; word-break:keep-all;
  }
  .adv-free{
    margin-top:8px; padding:7px 9px; border-radius:12px;
    background:rgba(255,255,255,.76);
    font-size:10.5px; font-weight:600; color:var(--ink);
    line-height:1.4; word-break:keep-all;
  }
  .adv-free b{
    display:block; font-size:9px; font-weight:700; letter-spacing:.03em;
    color:var(--lilac-700); margin-bottom:2px;
  }
  .adv-wait{
    font-size:10.5px; font-weight:500; line-height:1.5;
    color:var(--ink-2); opacity:.75; word-break:keep-all;
  }
  .adv-hint{
    margin-top:8px; font-size:9px; font-weight:600; letter-spacing:-.1px;
    color:var(--lilac-700); opacity:.7; word-break:keep-all;
  }

  /* ── 오늘로 돌아가기 ──────────────────── */
  .today-float{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 16px);
    transform:translate(-50%,16px); opacity:0; pointer-events:none; z-index:40;
    border:1px solid var(--line); border-radius:999px;
    background:rgba(35,36,42,.86); backdrop-filter:blur(10px);
    color:#fff; font-family:var(--sans); font-size:12px; font-weight:600;
    padding:9px 17px; transition:opacity .2s ease, transform .2s ease;
  }
  .today-float.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }

  /* ── 크게 보기 ───────────────────────── */
  .zoom-inner{ padding:2px 0 4px; }
  .zoom-inner.card, .zoom-inner.advice{
    background:transparent; border:none; padding:0; overflow:visible;
    display:block; backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .zoom-inner.card::before, .zoom-inner.advice::after{ display:none; }
  .zoom-inner .card-head, .zoom-inner .adv-head{
    padding-bottom:11px; margin-bottom:12px;
  }
  .zoom-inner .school{ font-size:18px; white-space:normal; }
  .zoom-inner .chip{ font-size:11.5px; padding:4px 10px; }
  .zoom-inner .adv-title{ font-size:19px; }
  .zoom-inner .adv-eyebrow{ font-size:10px; }
  .zoom-inner .adv-desc{ font-size:12px; }
  .zoom-inner .adv-zoom{ display:none; }
  .zoom-inner .adv-hint{ display:none; }
  .zoom-inner .card-body, .zoom-inner .adv-body{
    overflow:visible; -webkit-mask-image:none; mask-image:none; padding-bottom:0;
  }
  .zoom-inner .menu{ gap:9px; }
  .zoom-inner .menu li{ font-size:16px; line-height:1.45; gap:9px; }
  .zoom-inner .menu li::before{ width:4px; height:4px; margin-top:8px; }
  .zoom-inner .meal-label{ font-size:12px; margin-bottom:9px; }
  .zoom-inner .meal-block + .meal-block{ margin-top:16px; }
  .zoom-inner .card-foot{ font-size:12px; margin-top:14px; padding-top:12px; }
  .zoom-inner .empty{ font-size:14px; padding:22px 0; }
  .zoom-inner .empty b{ font-size:15px; margin-bottom:5px; }
  .zoom-inner .adv-row{ padding:9px 0; gap:9px; border-top-color:var(--line); }
  .zoom-inner .adv-tag{ font-size:11.5px; padding:4.5px 10px; background:#fff; border:1px solid var(--line); }
  .zoom-inner .adv-dishes{ font-size:15px; line-height:1.5; }
  .zoom-inner .adv-dishes em{ font-size:11px; }
  .zoom-inner .adv-minor{ font-size:12px; margin-top:10px; }
  .zoom-inner .adv-free{ font-size:14px; margin-top:14px; padding:12px 14px; background:var(--lime-50); border:1px solid var(--lime-100); }
  .zoom-inner .adv-free b{ font-size:11px; margin-bottom:4px; }
  .zoom-inner .adv-wait{ font-size:14px; }
  .zoom-sheet{ max-height:88dvh; }

  /* ── 설정 시트 ───────────────────────── */
  .backdrop{
    position:fixed; inset:0; z-index:50;
    background:rgba(35,36,42,.32);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    display:flex; align-items:flex-end;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-height:92dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#FCFCFA;
    border-radius:26px 26px 0 0;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .backdrop.open .sheet{ transform:translateY(0); }
  .grabber{ width:38px; height:4px; border-radius:999px; background:var(--line); margin:4px auto 14px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-title{ font-family:var(--serif); font-size:19px; font-weight:700; letter-spacing:-.4px; }
  .ghost-btn{
    border:1px solid var(--line); background:#fff; border-radius:12px;
    padding:8px 13px; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink-2);
  }
  .banner{
    font-size:12.5px; font-weight:500; line-height:1.5; color:var(--lilac-700);
    background:var(--lilac-50); border:1px solid var(--lilac-100);
    border-radius:14px; padding:11px 13px; margin-bottom:16px; word-break:keep-all;
  }
  .field-label{
    font-size:11.5px; font-weight:700; color:var(--muted);
    letter-spacing:.08em; margin:0 2px 8px;
  }
  .row{ display:flex; gap:8px; }
  input[type=text], input[type=password]{
    flex:1; min-width:0;
    font-family:var(--sans); font-size:16px; font-weight:500; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; outline:none;
  }
  input:focus{ border-color:var(--lilac-200); }
  .btn-primary{
    flex-shrink:0; border:none; border-radius:14px; padding:12px 16px;
    font-family:var(--sans); font-size:13.5px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#8FC178 0%,#8E7AD2 100%);
  }
  .btn-primary:active{ opacity:.85; }
  .note{ font-size:11.5px; line-height:1.55; color:var(--muted); margin:9px 2px 0; word-break:keep-all; }
  .note b{ color:var(--lilac-700); }
  .sheet-section{ margin-top:22px; }
  .slot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:13px 14px; margin-bottom:8px;
  }
  .slot.active{ border-color:var(--lime-500); background:var(--lime-50); }
  .slot-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .slot-no{
    width:22px; height:22px; border-radius:7px; flex-shrink:0;
    background:var(--lilac-100); color:var(--lilac-700);
    font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .slot.active .slot-no{ background:var(--lime-200); color:var(--lime-700); }
  .slot-name{
    font-size:14px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .slot-name.none{ color:var(--muted); font-weight:500; }
  .slot-state{ flex-shrink:0; font-size:11.5px; font-weight:700; color:var(--muted); }
  .slot.active .slot-state{ color:var(--lime-700); }
  .results{ list-style:none; margin-top:10px; }
  .results li{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:7px;
  }
  .results li strong{ display:block; font-size:14px; font-weight:600; }
  .results li small{ display:block; font-size:11px; color:var(--muted); margin-top:3px; }
  .results li.msg{ text-align:center; color:var(--muted); font-size:12.5px; background:transparent; border:none; }

  /* ── 화면 크기별 글씨 조정 ───────────── */
  @media (max-height:700px){
    :root{ --fs-school:11.5px; --fs-menu:10.8px; --fs-chip:9px; --fs-advtitle:12.5px; --fs-advdish:10.2px; }
    .brand-title{ font-size:18px; }
    .grid{ gap:7px; padding:7px 11px calc(env(safe-area-inset-bottom) + 8px); }
    .card{ padding:9px 9px 3px; }
    .advice{ padding:9px 10px 3px; }
  }
  @media (min-height:860px){
    :root{ --fs-school:13.5px; --fs-menu:12.8px; --fs-chip:10px; --fs-advtitle:14.5px; --fs-advdish:11.8px; }
    .brand-title{ font-size:22px; }
    .menu{ gap:5.5px; }
  }
  @media (min-width:600px){
    .grid{ max-width:720px; width:100%; margin:0 auto; }
    :root{ --fs-school:15px; --fs-menu:14px; --fs-chip:11px; --fs-advtitle:16px; --fs-advdish:13px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div>
        <p class="brand-sub">Our Family</p>
        <h1 class="brand-title">오늘의 <em>급식</em></h1>
      </div>
      <button type="button" class="icon-btn" id="open-modal-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
        설정
      </button>
    </div>

    <div class="date-bar">
      <button type="button" class="nav-btn" id="prev-day-btn">&#8249;</button>
      <button type="button" class="date-center" id="current-date">
        <span class="date-main" id="date-main">-</span>
        <span class="date-sub" id="date-sub">-</span>
      </button>
      <button type="button" class="nav-btn" id="next-day-btn">&#8250;</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>
</div>

<button type="button" class="today-float" id="today-btn">오늘로 돌아가기</button>

<div class="backdrop" id="zoom">
  <div class="sheet zoom-sheet">
    <div class="grabber"></div>
    <div id="zoom-body"></div>
  </div>
</div>

<div class="backdrop" id="modal">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 class="sheet-title">급식 설정</h2>
      <button type="button" class="ghost-btn" id="close-modal-btn">완료</button>
    </div>

    <div class="banner" id="status-banner">바꿀 칸을 고르고, 아래에서 학교를 검색해 선택해 주세요.</div>

    <p class="field-label">NEIS 인증키</p>
    <div class="row">
      <input type="text" id="api-key-input" placeholder="인증키 붙여넣기 (최초 1회)"
             autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button type="button" class="btn-primary" id="save-key-btn">저장</button>
    </div>
    <p class="note" id="api-note"></p>

    <div class="sheet-section">
      <p class="field-label">학교 세 곳</p>
      <div id="slot-list"></div>
    </div>

    <div class="sheet-section">
      <p class="field-label">학교 검색</p>
      <div class="row">
        <input type="text" id="school-input" placeholder="학교명 입력 (예: 별내초, 서울고)" />
        <button type="button" class="btn-primary" id="search-btn">검색</button>
      </div>
      <ul class="results" id="search-results">
        <li class="msg">학교 이름을 입력하고 검색을 눌러주세요.</li>
      </ul>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY_STORAGE = "neis_api_key_v1";
  var SCHOOL_STORAGE = "my_3split_schools_v4";
  var API_KEY = "";
  var TONES = ["t1","t2","t3"];
  var DAYS = ["일","월","화","수","목","금","토"];

  var schools = [
    { name:"", eduCode:"", schoolCode:"" },
    { name:"", eduCode:"", schoolCode:"" },
    { name:"", eduCode:"", schoolCode:"" }
  ];
  var selectedSlot = 0;
  var targetDate = new Date();
  var today = new Date();

  function readStorage(k){
    try { return window.localStorage ? window.localStorage.getItem(k) : null; }
    catch(e){ return null; }
  }
  function writeStorage(k,v){
    try { if(window.localStorage) window.localStorage.setItem(k,v); } catch(e){}
  }

  function loadSchools(){
    var raw = readStorage(SCHOOL_STORAGE);
    if(!raw) return;
    try {
      var parsed = JSON.parse(raw);
      if(Object.prototype.toString.call(parsed) === "[object Array]"){
        for(var i=0;i<3;i++){
          var p = parsed[i];
          if(p && p.schoolCode){
            schools[i] = { name:p.name || "", eduCode:p.eduCode || "", schoolCode:p.schoolCode || "" };
          }
        }
      }
    } catch(e){}
  }
  function saveSchools(){
    writeStorage(SCHOOL_STORAGE, JSON.stringify(schools));
  }

  API_KEY = (readStorage(KEY_STORAGE) || "").trim();
  loadSchools();

  function ymdOf(d){
    var m = String(d.getMonth()+1);
    var day = String(d.getDate());
    if(m.length < 2) m = "0" + m;
    if(day.length < 2) day = "0" + day;
    return "" + d.getFullYear() + m + day;
  }
  function sameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function diffDays(a,b){
    var x = new Date(a.getFullYear(),a.getMonth(),a.getDate());
    var y = new Date(b.getFullYear(),b.getMonth(),b.getDate());
    return Math.round((x-y)/86400000);
  }

  function cleanDish(t){
    return t
      .replace(/\(([^)]*)\)/g, function(m, inner){
        return /^[0-9.,\s]*$/.test(inner) ? "" : "(" + inner + ")";
      })
      .replace(/[0-9]+(\.[0-9]+)*\.?/g, "")
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  function cacheKeyOf(school, ymd){
    return "meal2_" + school.eduCode + "_" + school.schoolCode + "_" + ymd;
  }
  function readCache(school, ymd){
    var raw = readStorage(cacheKeyOf(school, ymd));
    if(!raw) return null;
    try {
      var parsed = JSON.parse(raw);
      if(parsed && parsed.meals && parsed.meals.length) return parsed;
    } catch(e){}
    return null;
  }

  function fetchMeal(school, ymd){
    if(!school || !school.schoolCode){
      return Promise.resolve(null);
    }
    var keyParam = API_KEY ? ("KEY=" + encodeURIComponent(API_KEY) + "&") : "";
    var url = "https://open.neis.go.kr/hub/mealServiceDietInfo?" + keyParam +
              "Type=json&ATPT_OFCDC_SC_CODE=" + encodeURIComponent(school.eduCode) +
              "&SD_SCHUL_CODE=" + encodeURIComponent(school.schoolCode) +
              "&MLSV_YMD=" + encodeURIComponent(ymd);

    return fetch(url).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(data){
      var info = data && data.mealServiceDietInfo;
      var rows = info && info[1] && info[1].row;
      if(!rows || !rows.length) return { meals: [] };

      var meals = [];
      for(var i=0;i<rows.length;i++){
        var r = rows[i];
        var parts = String(r.DDISH_NM || "").split(/<br\s*\/?>/);
        var items = [];
        for(var j=0;j<parts.length;j++){
          var name = cleanDish(parts[j]);
          if(name) items.push(name);
        }
        if(items.length){
          meals.push({
            type: String(r.MMEAL_SC_NM || "급식").trim(),
            cal: String(r.CAL_INFO || "").trim(),
            items: items
          });
        }
      }
      var order = { "조식":0, "중식":1, "석식":2 };
      meals.sort(function(a,b){
        var oa = order[a.type]; var ob = order[b.type];
        if(oa === undefined) oa = 9;
        if(ob === undefined) ob = 9;
        return oa - ob;
      });
      var payload = { meals: meals };
      if(meals.length) writeStorage(cacheKeyOf(school, ymd), JSON.stringify(payload));
      return payload;
    }).catch(function(){
      var cached = readCache(school, ymd);
      return cached ? cached : { error:true, meals:[] };
    });
  }

  function escapeHtml(t){
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ── 저녁 메뉴 참고: 점심 메인 요리 추출 ── */
  var ADV_STORAGE = "adv_open_v1";
  var adviceOpen = (readStorage(ADV_STORAGE) !== "0");
  var CIRCLE = ["\u2460", "\u2461", "\u2462"];

  var MAIN_GROUPS = [
    { key:"pork", label:"돼지고기", tone:"m",
      kw:["돼지","돈육","제육","삼겹","목살","앞다리살","뒷다리살","돈까스","돈가스","탕수육","수육","보쌈","두루치기","등갈비","폭립","동파육"] },
    { key:"beef", label:"소고기", tone:"m",
      kw:["소고기","쇠고기","우육","불고기","장조림","떡갈비","차돌","사골","우삼겹","산적","함박","햄버그","너비아니","완자","동그랑땡","미트볼"] },
    { key:"chicken", label:"닭고기", tone:"m",
      kw:["닭","치킨","계육","순살","텐더","찜닭"] },
    { key:"duck", label:"오리고기", tone:"m",
      kw:["오리"] },
    { key:"ham", label:"햄·소시지", tone:"m",
      kw:["소시지","비엔나","햄","베이컨","너겟","프랑크","핫도그","스팸"] },
    { key:"fish", label:"생선", tone:"f",
      kw:["고등어","삼치","갈치","가자미","임연수","코다리","동태","명태","대구","조기","꽁치","연어","참치","황태","북어","장어","아귀","메로","가오리","도루묵","병어","민어","삼치","생선","멸치","어포"] },
    { key:"sea", label:"해산물", tone:"f",
      kw:["오징어","주꾸미","쭈꾸미","낙지","문어","새우","꽃게","게살","홍합","바지락","조개","골뱅이","전복","해물","해산물","어묵","맛살"] },
    { key:"egg", label:"달걀", tone:"e",
      kw:["계란","달걀","메추리알"] },
    { key:"tofu", label:"두부·콩", tone:"e",
      kw:["두부","유부","콩고기","비지"] }
  ];

  /* 메인이라기엔 가벼운 반찬 — 따로 모아서 흐리게 표시 */
  var MINOR_KW = { "멸치":1, "어묵":1, "맛살":1, "어포":1, "쥐포":1 };

  var SUGGEST_ORDER = ["beef", "pork", "chicken", "fish", "sea", "egg", "tofu"];
  var SUGGEST_LABEL = {
    beef:"소고기", pork:"돼지고기", chicken:"닭고기",
    fish:"생선", sea:"해산물", egg:"달걀", tofu:"두부"
  };

  function matchGroup(name){
    for(var g=0; g<MAIN_GROUPS.length; g++){
      var kw = MAIN_GROUPS[g].kw;
      for(var k=0; k<kw.length; k++){
        if(kw[k] && name.indexOf(kw[k]) >= 0){
          return { group:MAIN_GROUPS[g], minor: !!MINOR_KW[kw[k]] };
        }
      }
    }
    return null;
  }

  function lunchItems(payload){
    if(!payload || !payload.meals || !payload.meals.length) return [];
    var picked = [];
    for(var i=0; i<payload.meals.length; i++){
      if(String(payload.meals[i].type).indexOf("중식") >= 0) picked.push(payload.meals[i]);
    }
    if(!picked.length) picked = payload.meals;
    var out = [];
    for(var j=0; j<picked.length; j++){
      out = out.concat(picked[j].items || []);
    }
    return out;
  }

  function analyzeMains(payloads){
    var buckets = {}, order = [], minorList = [], minorSeen = {};
    for(var i=0; i<payloads.length; i++){
      var items = lunchItems(payloads[i]);
      for(var j=0; j<items.length; j++){
        var nm = String(items[j]).trim();
        if(!nm) continue;
        var hit = matchGroup(nm);
        if(!hit) continue;
        if(hit.minor){
          if(!minorSeen[nm]){ minorSeen[nm] = 1; minorList.push(nm); }
          continue;
        }
        var key = hit.group.key;
        if(!buckets[key]){
          buckets[key] = { group:hit.group, dishes:[], index:{} };
          order.push(key);
        }
        var b = buckets[key];
        if(b.index[nm] === undefined){
          b.index[nm] = b.dishes.length;
          b.dishes.push({ name:nm, marks:[] });
        }
        var dish = b.dishes[b.index[nm]];
        if(dish.marks.indexOf(i) < 0) dish.marks.push(i);
      }
    }
    return { order:order, buckets:buckets, minor:minorList };
  }

  function adviceBody(payloads, isWeekend){
    var i, configured = 0, missing = 0;
    for(i=0; i<3; i++){
      if(schools[i] && schools[i].schoolCode){
        configured++;
        if(payloads[i] === null) missing++;
      }
    }
    if(!configured){
      return '<p class="adv-wait">설정에서 학교를 지정하시면, 점심에 나온 메인 요리를 여기에 모아 보여드릴게요.</p>';
    }
    if(missing){
      return '<p class="adv-wait">점심 메뉴를 확인하고 있어요…</p>';
    }

    var any = false;
    for(i=0; i<3; i++){
      if(lunchItems(payloads[i]).length){ any = true; break; }
    }
    if(!any){
      return '<p class="adv-wait">' + (isWeekend
        ? '주말엔 급식이 없어요. 저녁 메뉴는 자유롭게 정하셔도 괜찮아요.'
        : '점심 급식 정보가 없어 참고할 메뉴가 없어요.') + '</p>';
    }

    var res = analyzeMains(payloads);
    var html = "";

    if(!res.order.length){
      html += '<p class="adv-wait">고기·생선 같은 메인 요리를 찾지 못했어요.</p>';
    } else {
      for(var o=0; o<res.order.length; o++){
        var b = res.buckets[res.order[o]];
        var parts = [];
        for(var d=0; d<b.dishes.length; d++){
          var dish = b.dishes[d];
          var mk = "";
          if(configured > 1){
            for(var m=0; m<dish.marks.length; m++){
              mk += (CIRCLE[dish.marks[m]] || "");
            }
            if(mk) mk = '<em>' + mk + '</em>';
          }
          parts.push(escapeHtml(dish.name) + mk);
        }
        html += '<div class="adv-row">' +
                  '<span class="adv-tag ' + b.group.tone + '">' + escapeHtml(b.group.label) + '</span>' +
                  '<span class="adv-dishes">' + parts.join('<span class="sep">·</span>') + '</span>' +
                '</div>';
      }
      if(res.minor.length){
        html += '<p class="adv-minor">그 외 · ' + escapeHtml(res.minor.join(", ")) + '</p>';
      }
    }

    var blocked = {};
    for(var kk in res.buckets){
      if(res.buckets.hasOwnProperty(kk)) blocked[kk] = 1;
    }
    if(blocked.ham) blocked.pork = 1;
    if(blocked.duck) blocked.chicken = 1;

    var free = [];
    for(var s2=0; s2<SUGGEST_ORDER.length; s2++){
      if(!blocked[SUGGEST_ORDER[s2]]) free.push(SUGGEST_LABEL[SUGGEST_ORDER[s2]]);
    }
    if(free.length){
      html += '<p class="adv-free"><b>저녁엔 이쪽이 안 겹쳐요</b>' + escapeHtml(free.join(" · ")) + '</p>';
    } else {
      html += '<p class="adv-free"><b>오늘은 재료가 골고루 나왔어요</b>같은 재료라도 조리법을 달리해 보세요 (국 · 찜 · 구이)</p>';
    }

    if(configured > 1 && res.order.length){
      html += '<p class="adv-minor">\u2460\u2461\u2462 는 설정에 넣은 1·2·3번 학교예요</p>';
    }
    return html;
  }

  function adviceShell(bodyHtml){
    var d = diffDays(targetDate, today);
    var when = (d === 0)
      ? "오늘 점심"
      : ((targetDate.getMonth()+1) + "월 " + targetDate.getDate() + "일 점심");
    return '<div class="adv-head">' +
             '<span class="adv-head-left">' +
               '<span class="adv-eyebrow">Dinner Hint</span>' +
               '<span class="adv-title">저녁 메뉴 참고</span>' +
               '<span class="adv-desc">' + when + '에 나온 메인</span>' +
             '</span>' +
             '<span class="adv-zoom">\u2922</span>' +
           '</div>' +
           '<div class="adv-body">' + bodyHtml +
             '<p class="adv-hint">탭하면 크게 · 좌우로 쓸어 날짜 이동</p>' +
           '</div>';
  }

  function renderDateBar(){
    var main = document.getElementById("date-main");
    var sub = document.getElementById("date-sub");
    main.textContent = (targetDate.getMonth()+1) + "월 " + targetDate.getDate() + "일";
    var d = diffDays(targetDate, today);
    var label = DAYS[targetDate.getDay()] + "요일";
    if(d === 0) sub.innerHTML = label + ' · <span class="today-tag">오늘</span>';
    else if(d === 1) sub.innerHTML = label + ' · <span class="back-tag">내일</span>';
    else if(d === -1) sub.innerHTML = label + ' · <span class="back-tag">어제</span>';
    else sub.innerHTML = label + ' · <span class="back-tag">' + (d>0 ? ("+"+d+"일") : (d+"일")) + '</span>';

    var pill = document.getElementById("today-btn");
    if(d === 0) pill.className = "today-float";
    else pill.className = "today-float show";
  }

  function mealHtml(payload, isWeekend){
    if(payload && payload.meals && payload.meals.length){
      var html = "";
      for(var i=0;i<payload.meals.length;i++){
        var m = payload.meals[i];
        html += '<div class="meal-block">';
        if(payload.meals.length > 1){
          html += '<p class="meal-label">' + escapeHtml(m.type) + '</p>';
        }
        html += '<ul class="menu">';
        for(var j=0;j<m.items.length;j++){
          html += "<li>" + escapeHtml(m.items[j]) + "</li>";
        }
        html += "</ul></div>";
      }
      var cal = payload.meals[0].cal;
      if(cal) html += '<div class="card-foot">' + escapeHtml(cal) + "</div>";
      return html;
    }
    if(payload && payload.error){
      return '<div class="empty"><b>불러오지 못했습니다</b>네트워크 또는 인증키를 확인해 주세요.</div>';
    }
    if(isWeekend){
      return '<div class="empty"><b>주말에는 급식이 없어요</b>편안한 주말 보내세요.</div>';
    }
    return '<div class="empty"><b>급식 정보가 없습니다</b>방학 · 휴업일일 수 있어요.</div>';
  }

  /* ── 카드 크게 보기 ── */
  var touchMoved = false;

  function openZoom(cls, html){
    if(touchMoved) return;
    var box = document.getElementById("zoom-body");
    if(!box) return;
    box.className = "zoom-inner " + cls;
    box.innerHTML = html;
    document.getElementById("zoom").classList.add("open");
  }
  function closeZoom(){
    document.getElementById("zoom").classList.remove("open");
  }

  function chipOf(payload){
    if(payload && payload.meals && payload.meals.length === 1) return payload.meals[0].type;
    if(payload && payload.meals && payload.meals.length > 1) return "급식";
    return "-";
  }
  function cardHead(name, chipText){
    return '<div class="card-head">' +
             '<div class="school-wrap"><span class="dot"></span>' +
               '<h2 class="school">' + escapeHtml(name) + '</h2>' +
             '</div>' +
             '<span class="chip">' + escapeHtml(chipText) + '</span>' +
           '</div>';
  }

  var renderSeq = 0;

  function renderAll(){
    renderDateBar();
    var grid = document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML = "";

    var ymd = ymdOf(targetDate);
    var isWeekend = (targetDate.getDay() === 0 || targetDate.getDay() === 6);
    var seq = ++renderSeq;

    var payloads = [null, null, null];

    /* 1번 칸 — 저녁 메뉴 참고 */
    var advice = document.createElement("section");
    advice.className = "advice";
    advice.addEventListener("click", function(){
      openZoom("advice", advice.innerHTML);
    });
    grid.appendChild(advice);

    function paintAdvice(){
      if(seq !== renderSeq) return;
      advice.innerHTML = adviceShell(adviceBody(payloads, isWeekend));
    }

    /* 2~4번 칸 — 학교 세 곳 */
    schools.forEach(function(school, idx){
      var card = document.createElement("article");
      card.className = "card " + TONES[idx];
      card.addEventListener("click", function(){
        openZoom(card.className, card.innerHTML);
      });

      var name = school.name ? school.name : (idx+1) + "번 칸";

      if(!school.schoolCode){
        card.innerHTML = cardHead(name, "설정 필요") +
          '<div class="card-body"><div class="empty"><b>학교를 지정해 주세요</b>오른쪽 위 설정에서 검색할 수 있어요.</div></div>';
        grid.appendChild(card);
        return;
      }

      var cached = readCache(school, ymd);
      if(cached) payloads[idx] = cached;
      card.innerHTML = cardHead(name, cached ? chipOf(cached) : "조회 중") +
        '<div class="card-body">' +
          (cached ? mealHtml(cached, isWeekend) : '<div class="skel"><i></i><i></i><i></i></div>') +
        '</div>';
      grid.appendChild(card);

      fetchMeal(school, ymd).then(function(payload){
        if(seq !== renderSeq) return;
        card.innerHTML = cardHead(school.name, chipOf(payload)) +
          '<div class="card-body">' + mealHtml(payload, isWeekend) + '</div>';
        payloads[idx] = payload;
        paintAdvice();
      });
    });

    paintAdvice();
  }

  function changeDate(offset){
    targetDate.setDate(targetDate.getDate() + offset);
    renderAll();
  }
  function goToday(){
    today = new Date();
    targetDate = new Date();
    renderAll();
  }

  /* ── 설정 시트 ── */
  function renderSlots(){
    var list = document.getElementById("slot-list");
    if(!list) return;
    list.innerHTML = "";
    schools.forEach(function(s, idx){
      var div = document.createElement("div");
      div.className = "slot" + (idx === selectedSlot ? " active" : "");
      div.innerHTML =
        '<div class="slot-left">' +
          '<span class="slot-no">' + (idx+1) + "</span>" +
          '<span class="slot-name' + (s.name ? "" : " none") + '">' +
            escapeHtml(s.name ? s.name : "학교 미지정") +
          "</span>" +
        "</div>" +
        '<span class="slot-state">' + (idx === selectedSlot ? "선택됨" : "선택") + "</span>";
      div.addEventListener("click", function(){
        selectedSlot = idx;
        renderSlots();
        setBanner((idx+1) + "번 칸을 고르셨어요. 아래에서 학교를 검색해 선택해 주세요.");
      });
      list.appendChild(div);
    });
  }

  function setBanner(text){
    var b = document.getElementById("status-banner");
    if(b) b.textContent = text;
  }

  function openModal(){
    if(selectedSlot < 0 || selectedSlot > 2) selectedSlot = 0;
    renderSlots();
    renderApiNote();
    document.getElementById("modal").classList.add("open");
  }
  function closeModal(){
    document.getElementById("modal").classList.remove("open");
    renderAll();
  }

  function searchSchool(){
    var input = document.getElementById("school-input");
    var resultEl = document.getElementById("search-results");
    var query = (input && input.value ? input.value : "").trim();
    if(!query){
      setBanner("학교 이름을 먼저 입력해 주세요.");
      return;
    }
    resultEl.innerHTML = '<li class="msg">검색 중...</li>';
    var keyParam = API_KEY ? ("KEY=" + encodeURIComponent(API_KEY) + "&") : "";
    var url = "https://open.neis.go.kr/hub/schoolInfo?" + keyParam +
              "Type=json&SCHUL_NM=" + encodeURIComponent(query);

    fetch(url).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(data){
      var info = data && data.schoolInfo;
      var rows = info && info[1] && info[1].row;
      if(!rows || !rows.length){
        var msg = (data && data.RESULT && data.RESULT.MESSAGE) ? data.RESULT.MESSAGE : "검색 결과가 없습니다.";
        resultEl.innerHTML = '<li class="msg">' + escapeHtml(msg) + "</li>";
        return;
      }
      resultEl.innerHTML = "";
      rows.forEach(function(r){
        var obj = {
          name: String(r.SCHUL_NM || "").trim(),
          eduCode: String(r.ATPT_OFCDC_SC_CODE || "").trim(),
          schoolCode: String(r.SD_SCHUL_CODE || "").trim()
        };
        var address = r.ORG_RDNMA || r.ATPT_OFCDC_SC_NM || "";
        var li = document.createElement("li");
        var strong = document.createElement("strong");
        strong.textContent = obj.name;
        var small = document.createElement("small");
        small.textContent = address;
        li.appendChild(strong);
        li.appendChild(small);
        li.addEventListener("click", function(){ applySchool(obj); });
        resultEl.appendChild(li);
      });
    }).catch(function(){
      resultEl.innerHTML = '<li class="msg">조회 오류 — 네트워크 또는 인증키를 확인해 주세요.</li>';
    });
  }

  function applySchool(obj){
    if(!obj || !obj.name) return;
    schools[selectedSlot] = { name:obj.name, eduCode:obj.eduCode, schoolCode:obj.schoolCode };
    saveSchools();
    renderSlots();
    setBanner((selectedSlot+1) + "번 칸에 '" + obj.name + "' 저장했어요.");
  }

  function renderApiNote(){
    var note = document.getElementById("api-note");
    var input = document.getElementById("api-key-input");
    if(input && !input.value) input.value = API_KEY;
    if(!note) return;
    note.innerHTML = API_KEY
      ? "인증키가 이 기기에만 저장되어 있어요. 급식이 비어 보이면 키를 다시 확인해 주세요."
      : "<b>인증키 미설정</b> — open.neis.go.kr 에서 발급한 키를 넣으면 조회가 안정적으로 동작합니다.";
  }

  function saveApiKey(){
    var input = document.getElementById("api-key-input");
    API_KEY = (input && input.value ? input.value : "").trim();
    writeStorage(KEY_STORAGE, API_KEY);
    writeStorage("neis_key_prompted_v1", "1");
    renderApiNote();
    setBanner(API_KEY ? "인증키를 저장했어요." : "인증키를 비웠습니다.");
    renderAll();
  }

  document.getElementById("prev-day-btn").addEventListener("click", function(){ changeDate(-1); });
  document.getElementById("next-day-btn").addEventListener("click", function(){ changeDate(1); });
  document.getElementById("current-date").addEventListener("click", goToday);
  document.getElementById("today-btn").addEventListener("click", goToday);
  document.getElementById("open-modal-btn").addEventListener("click", openModal);
  document.getElementById("close-modal-btn").addEventListener("click", closeModal);
  document.getElementById("search-btn").addEventListener("click", searchSchool);
  document.getElementById("school-input").addEventListener("keydown", function(e){
    if(e.key === "Enter") searchSchool();
  });
  document.getElementById("save-key-btn").addEventListener("click", saveApiKey);
  document.getElementById("api-key-input").addEventListener("keydown", function(e){
    if(e.key === "Enter") saveApiKey();
  });
  document.getElementById("modal").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });

  document.getElementById("zoom").addEventListener("click", function(){ closeZoom(); });

  /* 좌우 스와이프로 날짜 이동 */
  var sx = 0, sy = 0;
  var listEl = document.getElementById("grid");
  listEl.addEventListener("touchstart", function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    touchMoved = false;
  }, { passive:true });
  listEl.addEventListener("touchmove", function(e){
    var dx = e.touches[0].clientX - sx;
    var dy = e.touches[0].clientY - sy;
    if(Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
  }, { passive:true });
  listEl.addEventListener("touchend", function(e){
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4){
      changeDate(dx < 0 ? 1 : -1);
    }
  }, { passive:true });

  renderApiNote();
  renderAll();

  if(!API_KEY && !readStorage("neis_key_prompted_v1")){
    writeStorage("neis_key_prompted_v1", "1");
    openModal();
    setBanner("먼저 NEIS 인증키를 넣고, 1~3번 칸에 학교를 지정해 주세요.");
  }
})();
</script>
</body>
</html>
